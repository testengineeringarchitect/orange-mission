<!DOCTYPE html>
<html>
<head>
  <title>OrangeOS Devotion</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8e1;
      color: #333;
      padding: 40px;
      text-align: center;
    }
    h1 {
      color: #d77d00;
      font-size: 2.5em;
    }
    blockquote {
      font-size: 1.3em;
      color: #444;
      margin: 30px auto;
      max-width: 600px;
    }
    footer {
      margin-top: 50px;
      font-size: 0.9em;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>🍊 Good Morning, Child of God</h1>

  <blockquote id="verse">
    “Man shall not live by bread alone, but by every word that comes from the mouth of God.”  
    <br>– Matthew 4:4
  </blockquote>

  <p>Start your day with the Word. Breathe. Pray. Listen. He is with you.</p>

  <footer>OrangeOS Devotion • Built for Jesus</footer>

  <script>
    const verses = [
      "“The Lord is my shepherd; I shall not want.” – Psalm 23:1",
      "“I can do all things through Christ who strengthens me.” – Philippians 4:13",
      "“Trust in the Lord with all your heart...” – Proverbs 3:5",
      "“For I know the plans I have for you...” – Jeremiah 29:11",
      "“Be still, and know that I am God.” – Psalm 46:10",
      "“Jesus Christ is the same yesterday and today and forever.” – Hebrews 13:8",
	  "“Man shall not live by bread alone...” - Matthew 4:4"
    ];

    const verse = verses[Math.floor(Math.random() * verses.length)];
    document.getElementById("verse").innerText = verse;
  </script>
</body>
</html>
