<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deep Dive | OrangeOS</title>
  <style>
    :root {
      --bg-outer-top: #020617;
      --bg-outer-bottom: #000;
      --accent: #f97316;
      --card-bg: #18181b;
      --text-main: #f9fafb;
      --text-muted: #d4d4d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, var(--bg-outer-top) 0%, var(--bg-outer-bottom) 55%, #000 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
    }
    .phone {
      width: 420px;
      max-width: 100%;
      aspect-ratio: 9 / 19.5;
      background: linear-gradient(180deg, #0b1220, #020617);
      border-radius: 46px;
      padding: 18px 18px 30px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 0 8px rgba(0,0,0,0.7);
      position: relative;
      overflow: hidden;
    }
    .status-row {
      display:flex;align-items:center;justify-content:space-between;
      font-size:.82rem;padding:4px 6px 0;color:#e5e7eb;opacity:.9;
    }
    .status-right{display:flex;gap:6px;align-items:center;}
    .status-pill{
      padding:1px 10px;border-radius:999px;
      background:rgba(15,23,42,.9);font-size:.7rem;
      display:inline-flex;align-items:center;gap:4px;
    }
    .status-pill span.dot{
      width:7px;height:7px;border-radius:999px;background:#22c55e;
    }
    .notch{
      position:absolute;top:18px;left:50%;transform:translateX(-50%);
      width:180px;height:26px;border-radius:999px;background:#000;
      box-shadow:0 4px 10px rgba(0,0,0,.9);
    }
    .screen-wrapper{position:absolute;inset:60px 12px 30px;}
    .screen{position:absolute;inset:0;display:flex;flex-direction:column;}
    .dd-card{
      margin:auto;width:100%;height:100%;padding:20px 16px 12px;
      background:radial-gradient(circle at top,#111827,#020617 60%);
      border-radius:30px;
      box-shadow:0 18px 40px rgba(0,0,0,.75),0 0 0 1px rgba(55,65,81,.7);
      overflow-y:auto;
    }
    .back-link{
      font-size:.85rem;color:#c4c4ff;text-align:left;cursor:pointer;margin-bottom:8px;
    }
    .back-link:hover{text-decoration:underline;}
    h1{margin:4px 0 0;font-size:1.5rem;color:var(--accent);text-align:center;}
    h2{margin:4px 0;font-size:1.1rem;text-align:center;}
    .version-label{text-align:center;font-size:.83rem;color:#e4e4e7;margin-bottom:4px;}
    .version-note{text-align:center;font-size:.76rem;color:#a1a1aa;margin-bottom:14px;}
    blockquote{
      margin:10px auto 16px;padding:0 6px;font-size:.98rem;
      font-style:italic;line-height:1.7;color:#e5e5e5;text-align:center;
    }
    .section-title{
      margin-top:8px;margin-bottom:4px;font-weight:600;font-size:.95rem;
      color:#fde68a;display:flex;align-items:center;gap:6px;
    }
    .section-title span.icon{font-size:1rem;}
    ul.support-list{
      margin:4px 0 12px 18px;padding-left:0;font-size:.84rem;color:var(--text-muted);
    }
    ul.support-list li{margin-bottom:4px;}
    #devotionalBody{
      font-size:.86rem;line-height:1.6;color:var(--text-muted);
      margin-top:2px;margin-bottom:10px;
    }
    .audio-controls{
      display:flex;justify-content:center;gap:10px;
      margin:6px 0 14px;flex-wrap:wrap;
    }
    .audio-controls button{
      border-radius:999px;border:none;padding:7px 14px;
      font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    }
    #listenBtn{
      background:linear-gradient(135deg,#f97316,#fbbf24);
      color:#111827;box-shadow:0 10px 20px rgba(0,0,0,.7);
    }
    #stopBtn{
      background:rgba(39,39,42,.9);color:#e5e7eb;
      border:1px solid rgba(113,113,122,.8);
    }
    .notes{margin-top:4px;}
    .notes h3{
      font-size:.92rem;margin-bottom:4px;display:flex;align-items:center;gap:6px;
    }
    .notes h3 span.icon{font-size:1rem;}
    textarea{
      width:100%;height:90px;padding:8px;font-size:.86rem;
      border:1px solid #3f3f46;border-radius:8px;box-sizing:border-box;
      background:#09090b;color:#f9fafb;resize:vertical;
    }
    button.save-notes{
      margin-top:6px;padding:7px 14px;background-color:#f97316;
      color:#111827;font-size:.85rem;border:none;border-radius:999px;
      cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      box-shadow:0 10px 18px rgba(0,0,0,.7);
    }
    .footer{margin-top:10px;font-size:.78rem;color:#a1a1aa;text-align:center;}
    .home-indicator{
      position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
      width:90px;height:4px;border-radius:999px;background:rgba(255,255,255,.85);
    }
    .toast{
      position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
      padding:6px 10px;border-radius:999px;font-size:.78rem;
      background:rgba(15,23,42,.96);color:#f9fafb;
      opacity:0;pointer-events:none;transition:opacity .2s ease;
      box-shadow:0 12px 22px rgba(0,0,0,.8);max-width:260px;text-align:center;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-row">
      <div id="statusTime">7:23 PM</div>
      <div class="status-right">
        <div class="status-pill">
          <span class="dot"></span>
          <span>OrangeOS</span>
        </div>
        <div class="status-pill">🔍 Deep Dive</div>
      </div>
    </div>
    <div class="notch"></div>

    <div class="screen-wrapper">
      <section class="screen">
        <div class="dd-card">
          <div class="back-link" onclick="goBack()">← Back to Devotionals</div>

          <h1>🔎 Deep Dive Study</h1>
          <h2 id="ddReference">Reference</h2>
          <div id="ddVersionLabel" class="version-label"></div>
          <div id="versionNote" class="version-note"></div>

          <blockquote id="ddText">Verse text will appear here.</blockquote>

          <div id="supportingSection">
            <div class="section-title">
              <span class="icon">📘</span>
              <span>Supporting Verses</span>
            </div>
            <ul id="supportList" class="support-list"></ul>
          </div>

          <div id="applicationSection">
            <div class="section-title">
              <span class="icon">💡</span>
              <span>Real-Life Application</span>
            </div>
            <p id="devotionalBody"></p>
          </div>

          <div class="audio-controls">
            <button id="listenBtn">▶ Listen to This Study</button>
            <button id="stopBtn">■ Stop Audio</button>
          </div>

          <div class="notes">
            <h3>
              <span class="icon">📝</span>
              <span>Your Study Notes</span>
            </h3>
            <textarea id="userNotes" placeholder="What is Jesus showing you through this verse?"></textarea>
            <button class="save-notes" onclick="saveNotes()">📓 Save to Study Notes</button>
          </div>

          <div class="footer">
            OrangeOS — Rooted in Scripture, Built for Eternity
          </div>
        </div>
      </section>
    </div>

    <div id="toast" class="toast"></div>
    <div class="home-indicator"></div>
  </div>

  <script>
    function goBack() {
      window.location.href = "bible.html";
    }

    function formatTime(d){
      let h=d.getHours();const m=d.getMinutes().toString().padStart(2,"0");
      const ampm=h>=12?"PM":"AM";h=h%12||12;return `${h}:${m} ${ampm}`;
    }
    function updateStatusTime(){
      document.getElementById("statusTime").textContent=formatTime(new Date());
    }
    updateStatusTime();
    setInterval(updateStatusTime,30000);

    const toastEl=document.getElementById("toast");
    let toastTimeout;
    function showToast(msg){
      toastEl.textContent=msg;
      toastEl.style.opacity="1";
      clearTimeout(toastTimeout);
      toastTimeout=setTimeout(()=>toastEl.style.opacity="0",2000);
    }

    const metaJson=localStorage.getItem("deepDiveMeta");
    let meta=null;
    try{ if(metaJson) meta=JSON.parse(metaJson);}catch(e){console.error(e);}

    const ddRef=document.getElementById("ddReference");
    const ddVersionLabel=document.getElementById("ddVersionLabel");
    const ddText=document.getElementById("ddText");
    const versionNoteEl=document.getElementById("versionNote");
    const ulSupport=document.getElementById("supportList");
    const devoBody=document.getElementById("devotionalBody");

    const deepStudies={
      "eph1-13":{supporting:[
        {ref:"Ephesians 4:30 (KJV)",snippet:"You are sealed unto the day of redemption."},
        {ref:"2 Corinthians 1:21–22 (KJV)",snippet:"God has sealed us and given the Spirit as a guarantee."},
        {ref:"John 10:28–29 (KJV)",snippet:"No one can snatch His sheep out of His hand."},
        {ref:"Romans 8:38–39 (KJV)",snippet:"Nothing can separate us from the love of God in Christ."},
        {ref:"Philippians 1:6 (KJV)",snippet:"He who began a good work in you will complete it."}
      ],devotionalHtml:`
        When Paul says you are <strong>“sealed with the Holy Spirit of promise”</strong>, he means that the moment you truly
        trust Jesus, God marks you as His own. A seal in Bible times was a royal stamp — ownership, protection, and authenticity.<br><br>
        These passages repeat that promise: the Spirit is your guarantee, you are kept until the day of redemption, and no one can
        pull you out of Christ’s hand. Nothing in life or death can separate you from His love.<br><br>
        In daily life this changes your mindset. You do not wake up trying to earn God’s approval. You wake up <strong>already
        accepted and sealed</strong>. You fight old habits and sin <em>from</em> freedom, not <em>for</em> freedom. When shame or your
        past says, “God is done with you,” you answer with Scripture: “I belong to Jesus. I am sealed. He promised, and He cannot lie.”<br><br>
        This is why steady exposure to Scripture matters — reading, hearing, and even listening while you drive or get ready.
        When you fill those moments with the Word instead of noise, the Spirit slowly retrains your thoughts to think more like Jesus.
      `},
      "col2-13":{supporting:[
        {ref:"Colossians 2:14 (KJV)",snippet:"The record of debt against us was nailed to His cross."},
        {ref:"Colossians 1:13–14 (KJV)",snippet:"In Him we have redemption and the forgiveness of sins."},
        {ref:"Psalm 103:12 (KJV)",snippet:"He removes our transgressions as far as east from west."},
        {ref:"Hebrews 10:17 (KJV)",snippet:"Their sins and iniquities will I remember no more."},
        {ref:"Romans 8:1 (KJV)",snippet:"No condemnation to them which are in Christ Jesus."}
      ],devotionalHtml:`
        Colossians 2:13 says God made you alive with Christ, <strong>“having forgiven you all trespasses.”</strong> Not just the small
        things, but every sin — past, present, and future.<br><br>
        Verse 14 explains that the legal record against you was nailed to the cross. Other passages echo this: your guilt is
        removed, God chooses not to remember your sins, and there is now no condemnation for those in Christ.<br><br>
        Practically, that means you are not working off a spiritual criminal record. You may still live with earthly consequences,
        but heaven’s courtroom has already dropped the charges because Jesus took them. That frees you from shame
        (“God could never use me”) and from pride (“I’m doing pretty well on my own”).<br><br>
        As you rehearse these truths, your mind gets re-trained: <strong>“I am forgiven. I am alive in Christ. I am no longer
        condemned.”</strong> Obedience becomes a loving response, not a payment plan.
      `},
      "php4-13":{supporting:[
        {ref:"Philippians 4:11–12 (KJV)",snippet:"Paul learned to be content in every situation."},
        {ref:"2 Corinthians 12:9 (KJV)",snippet:"Christ’s strength is made perfect in weakness."},
        {ref:"John 15:5 (KJV)",snippet:"Without Jesus we can do nothing."},
        {ref:"Isaiah 40:31 (KJV)",snippet:"Those who wait on the LORD renew their strength."},
        {ref:"Romans 8:37 (KJV)",snippet:"We are more than conquerors through Him that loved us."}
      ],devotionalHtml:`
        Philippians 4:13 is often quoted alone, but in context Paul is talking about contentment — having a lot or a little,
        being free or imprisoned, and still trusting Christ. The <strong>“all things”</strong> means every circumstance God places you in.<br><br>
        These supporting verses remind you that strength comes from Jesus, not from your own willpower. You are invited to bring
        pressure, stress, and weakness to Him instead of trying to grind through in the flesh.<br><br>
        When you catch yourself thinking, “I can’t handle this,” answer with the truth: <strong>“On my own I can’t, but through Christ
        who strengthens me, I can walk through whatever He allows today.”</strong> That is how this verse becomes a steady, quiet courage,
        not a slogan on a poster.
      `},
      "isa26-3":{supporting:[
        {ref:"Isaiah 26:4 (KJV)",snippet:"Trust ye in the LORD for ever: for in the LORD is everlasting strength."},
        {ref:"Philippians 4:6–7 (KJV)",snippet:"The peace of God guards your heart and mind in Christ Jesus."},
        {ref:"John 14:27 (KJV)",snippet:"Jesus gives a peace the world cannot give or take away."},
        {ref:"Psalm 112:7 (KJV)",snippet:"His heart is fixed, trusting in the LORD."},
        {ref:"Romans 8:6 (KJV)",snippet:"To be spiritually minded is life and peace."}
      ],devotionalHtml:`
        Isaiah 26:3 promises that God keeps in <strong>perfect peace</strong> the one whose mind is stayed on Him because he trusts Him.
        Peace is not the absence of problems; it is the steady awareness that your Father is in control.<br><br>
        These supporting verses show that peace is tied to trust and focus. When your thoughts are fixed on Jesus, not on worst-case
        scenarios, His Spirit guards your heart and mind even while circumstances stay hard.<br><br>
        In practice this looks like repeatedly turning your attention back to the Lord through Scripture, prayer, and worship.
        When anxiety rises, you deliberately hand the situation to Him and say, “I choose to trust You here.” Over time, your reflex
        shifts from panic to prayer — and His peace becomes more familiar than fear.
      `},
      "isa54-17":{supporting:[
        {ref:"Romans 8:31 (KJV)",snippet:"If God be for us, who can be against us?"},
        {ref:"Psalm 27:1 (KJV)",snippet:"The LORD is my light and salvation; whom shall I fear?"},
        {ref:"2 Corinthians 10:4–5 (KJV)",snippet:"The weapons of our warfare are mighty through God."},
        {ref:"1 John 4:4 (KJV)",snippet:"Greater is He that is in you, than he that is in the world."},
        {ref:"Ephesians 6:10–11 (KJV)",snippet:"Be strong in the Lord; put on the whole armour of God."}
      ],devotionalHtml:`
        Isaiah 54:17 does not promise that weapons will never be formed against you — only that they will not <strong>finally</strong>
        prosper. God claims the final word over accusations, spiritual attack, and human opposition.<br><br>
        The supporting passages reinforce this: if God is for you, who can stand against you? He equips you with spiritual armor and
        inner strength so that even when you are wounded, you are not destroyed.<br><br>
        In real life this means you can expect resistance — from the enemy, from the world, even from your own history — and still
        move forward. You answer lies with Scripture, bring every thought captive to Christ, and remember that your heritage as His
        servant is protection, not abandonment. The battle may be fierce, but the outcome belongs to the Lord.
      `}
    };

    function loadDeepStudy(metaObj){
      const study=deepStudies[metaObj.id];
      document.getElementById("supportingSection").style.display="block";
      document.getElementById("applicationSection").style.display="block";

      if(!study){
        ulSupport.innerHTML="<li>Deep dive content for this verse is coming soon.</li>";
        devoBody.textContent=
          "For now, thank Jesus for what this verse says and ask Him to show you how it applies to your life today.";
        return;
      }
      ulSupport.innerHTML="";
      study.supporting.forEach(s=>{
        const li=document.createElement("li");
        li.textContent=`${s.ref} – ${s.snippet}`;
        ulSupport.appendChild(li);
      });
      devoBody.innerHTML=study.devotionalHtml;
    }

    function showFallback(){
      ddRef.textContent="No verse selected";
      ddVersionLabel.textContent="";
      versionNoteEl.textContent=
        "Open the devotion page first, choose a verse, and tap Go Deeper to load a study.";
      ddText.textContent="";
      document.getElementById("supportingSection").style.display="none";
      document.getElementById("applicationSection").style.display="none";
    }

    let notesKey="deepNotes_unknown";
    const notesEl=document.getElementById("userNotes");

    function loadNotes(metaObj){
      notesKey=metaObj?`deepNotes_${metaObj.id}_${metaObj.versionKey||"kjv"}`:notesKey;
      try{
        const saved=localStorage.getItem(notesKey);
        if(saved) notesEl.value=saved;
      }catch(e){console.warn("Unable to load notes:",e);}
    }

    function saveNotes(){
      try{
        localStorage.setItem(notesKey,notesEl.value||"");
        showToast("Notes saved on this device.");
      }catch(e){
        console.warn("Unable to save notes:",e);
        showToast("Could not save notes (storage issue).");
      }
    }
    window.saveNotes=saveNotes;

    if(meta){
      ddRef.textContent=meta.reference;
      ddVersionLabel.textContent=`Version: ${meta.versionLabel}`;
      versionNoteEl.textContent=`You’re studying this in: ${meta.versionLabel}. You can switch versions on the devotion page.`;
      ddText.textContent=meta.text;
      loadDeepStudy(meta);
      loadNotes(meta);
    }else{
      showFallback();
    }

    // --- AUDIO: soften and simplify ---
    const listenBtn=document.getElementById("listenBtn");
    const stopBtn=document.getElementById("stopBtn");
    let ttsVoice=null;

    function chooseVoice(){
      if(!("speechSynthesis" in window)) return;
      const voices=window.speechSynthesis.getVoices();
      if(!voices || !voices.length) return;
      const preferred=voices.find(v =>
        /female|woman|zira|samantha|google us english female/i.test(
          ((v.name||"")+" "+(v.lang||""))
        )
      );
      const english=voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en"));
      ttsVoice=preferred || english || voices[0] || null;
    }
    if("speechSynthesis" in window){
      chooseVoice();
      window.speechSynthesis.onvoiceschanged=chooseVoice;
    }

    function buildStudyText(){
      const a=ddRef.innerText||"";
      const b=ddText.innerText||"";
      const c=devoBody.innerText||"";
      return `${a}. ${b} ${c}`.trim();
    }

    listenBtn.addEventListener("click", () => {
      if(!("speechSynthesis" in window)){
        showToast("Audio not supported in this browser.");
        return;
      }
      const text=buildStudyText();
      if(!text){
        showToast("Nothing to read yet.");
        return;
      }
      const synth=window.speechSynthesis;
      synth.cancel();

      const utter=new SpeechSynthesisUtterance(text);
      if(ttsVoice) utter.voice=ttsVoice;  // soft female / English if available
      utter.rate=0.98;
      utter.pitch=1.02;

      try{
        synth.speak(utter);
      }catch(e){
        console.warn("speak() failed",e);
        showToast("Could not start audio.");
      }
    });

    stopBtn.addEventListener("click", () => {
      if(!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
    });
  </script>
</body>
</html>
